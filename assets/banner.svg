<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a1a2e" />
            <stop offset="100%" stop-color="#16213e" />
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff004c" />
            <stop offset="50%" stop-color="#e94560" />
            <stop offset="100%" stop-color="#00a8ff" />
        </linearGradient>
    </defs>
    <rect width="800" height="200" fill="url(#bg)" rx="15" ry="15"/>
    <text x="400" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle">
        China 🇨🇳 vs US 🇺🇸 AI Token Volume
    </text>
    <text x="400" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" dominant-baseline="middle">
        The Great AI Bubble &amp; Crossover of 2025-2026
    </text>
    <circle cx="100" cy="100" r="12" fill="#ff004c">
        <animate attributeName="cy" values="80;120;80" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="100" r="12" fill="#00a8ff">
        <animate attributeName="cy" values="120;80;120" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Dynamic flying nodes -->
    <circle cx="150" cy="50" r="4" fill="#ffffff" opacity="0.8">
        <animate attributeName="cx" values="150; 650; 150" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="150" r="4" fill="#ffffff" opacity="0.8">
        <animate attributeName="cx" values="650; 150; 650" dur="4s" repeatCount="indefinite" />
    </circle>
</svg>
